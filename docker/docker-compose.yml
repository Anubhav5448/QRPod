services:
  postgres:
    image: postgres:16-alpine
    container_name: hospitality_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hospitality
      POSTGRES_PASSWORD: hospitality_dev_password
      POSTGRES_DB: hospitality_dev
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hospitality -d hospitality_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hospitality_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: